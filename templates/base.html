<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CyberSec Playground{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  {% block head %}{% endblock %}
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg csp-navbar">
    <div class="container">
      <a class="navbar-brand csp-brand" href="/">
        <span class="brand-icon"><i class="bi bi-shield-lock-fill"></i></span>
        <span class="brand-text">CyberSec<span class="brand-accent">Playground</span></span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
        aria-controls="navMenu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/password' %}active{% endif %}" href="/password">
              <i class="bi bi-key-fill me-1"></i>Password
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/url' %}active{% endif %}" href="/url">
              <i class="bi bi-link-45deg me-1"></i>URL
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/whois' %}active{% endif %}" href="/whois">
              <i class="bi bi-globe2 me-1"></i>WHOIS
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/dns' %}active{% endif %}" href="/dns">
              <i class="bi bi-diagram-3-fill me-1"></i>DNS
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/scanner' %}active{% endif %}" href="/scanner">
              <i class="bi bi-radar me-1"></i>Port Scan
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/hash' %}active{% endif %}" href="/hash">
              <i class="bi bi-hash me-1"></i>Hash
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/ssl' %}active{% endif %}" href="/ssl">
              <i class="bi bi-patch-check-fill me-1"></i>SSL
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/headers' %}active{% endif %}" href="/headers">
              <i class="bi bi-shield-check me-1"></i>Headers
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── Page Content ───────────────────────────────────────────────────── -->
  <main class="csp-main">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="csp-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-brand">
          <i class="bi bi-shield-lock-fill me-1"></i>CyberSec Playground
        </span>
        <span class="footer-note">Built for learning. Use responsibly.</span>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
